name: Fetch Socrata schemas

# Fetches dataset metadata for every Socrata permit endpoint registered in
# data/permit-registry.js and commits the refreshed metadata directly to the
# default branch (only when it actually changed).
#
# Why GitHub Actions: agent egress and several browser sessions are blocked
# from the WA municipal Socrata endpoints (Cloudflare anti-scrape wall).
# GitHub Actions runners use a different IP allocation that the same hosts
# do not block, so this workflow is the only fully-automated path to keep
# the permit-registry's _unverifiedEndpoint flags accurate.
#
# Why direct-commit (not a PR): the only files this job ever writes are the two
# generated metadata files (data/_socrata-schemas.json, data/_arcgis-schemas.json)
# — pure data, never executed at runtime. A daily review PR added no safety, only
# clutter (39 unmerged PRs accumulated before this was changed). The job now
# commits the refresh straight to the default branch, and ONLY when the schema
# actually changed. Source scripts/code are never touched by this job, so the
# blast radius of a hijacked upstream host is limited to non-executed metadata.
#
# Trigger:
#   - push touching the workflow, the fetch scripts, or the registry
#   - daily at 09:00 UTC (catches schema drift)
#   - workflow_dispatch
on:
  push:
    paths:
      - '.github/workflows/fetch-schemas.yml'
      - 'scripts/fetch-socrata-schemas.py'
      - 'scripts/fetch-arcgis-schemas.py'
      - 'scripts/sync-permit-registry.py'
      - 'data/permit-registry.js'
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write          # commit the schema refresh directly to the default branch

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Socrata schemas
        run: python3 scripts/fetch-socrata-schemas.py

      - name: Fetch ArcGIS schemas
        run: python3 scripts/fetch-arcgis-schemas.py

      - name: Commit schema refresh to the default branch if changed
        env:
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Only the two generated metadata files are ever considered.
          if git diff --quiet -- data/_socrata-schemas.json data/_arcgis-schemas.json; then
            echo "No schema changes — nothing to commit."
            exit 0
          fi
          DATE=$(date -u +%Y%m%d-%H%M)
          git config user.name  "archdraw-bot"
          git config user.email "archdraw-bot@users.noreply.github.com"
          # Stage ONLY the metadata files (never source), then commit + push to
          # the default branch directly. [skip ci] keeps a data-only refresh from
          # triggering the Pages deploy (these files feed sync-permit-registry.py,
          # not the runtime app).
          git add data/_socrata-schemas.json data/_arcgis-schemas.json
          git commit -m "fetch-schemas: refresh Socrata + ArcGIS metadata (${DATE}) [skip ci]"
          # Rebase onto the latest tip first so a concurrent push can't cause a
          # non-fast-forward rejection; autostash guards any stray script artifacts.
          git pull --rebase --autostash origin "${BASE_BRANCH}"
          git push origin "HEAD:${BASE_BRANCH}"
          echo "Committed schema refresh directly to ${BASE_BRANCH}."
